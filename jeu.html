<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeu de révision — Personnages Historiques 3e</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink:    #1a1610;
      --paper:  #f5f0e8;
      --sepia:  #c8b89a;
      --gold:   #b8922a;
      --muted:  #7a6e60;
      --bg:     #faf7f2;
      --border: #d6cfc4;
      --green-bg: #EAF3DE;
      --green-border: #639922;
      --green-text: #3B6D11;
      --red-bg: #FCEBEB;
      --red-border: #A32D2D;
      --red-text: #501313;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Source Serif 4', Georgia, serif;
      font-weight: 300;
      min-height: 100vh;
    }

    nav {
      background: var(--ink);
      padding: 0.75rem 1.5rem;
      border-bottom: 2px solid var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sepia);
      text-decoration: none;
    }
    nav a:hover { color: var(--gold); }
    nav .nav-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--paper);
    }

    .wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 2rem 1.25rem 4rem;
    }

    /* SCORE BAR */
    .score-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 1.5rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .progress-track {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 0.3s;
      width: 0%;
    }
    .reset-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .reset-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* QUESTION */
    .question-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 1.25rem;
      color: var(--ink);
    }
    .type-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    /* QCM */
    .opt-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 3px;
      font-family: 'Source Serif 4', serif;
      font-size: 0.9rem;
      color: var(--ink);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .opt-btn:hover:not(:disabled) { border-color: var(--gold); background: var(--paper); }
    .opt-btn.correct { background: var(--green-bg); border-color: var(--green-border); color: var(--green-text); }
    .opt-btn.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-text); }

    /* FEEDBACK */
    .feedback {
      display: none;
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 3px;
      font-size: 0.88rem;
      line-height: 1.6;
    }
    .feedback.ok { background: var(--green-bg); border: 1px solid var(--green-border); color: var(--green-text); }
    .feedback.ko { background: var(--red-bg); border: 1px solid var(--red-border); color: var(--red-text); }

    /* NEXT BTN */
    .next-btn {
      display: none;
      margin-top: 1rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.6rem 1.2rem;
      border: 1.5px solid var(--gold);
      border-radius: 2px;
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .next-btn:hover { background: var(--gold); color: #fff; }

    /* ASSOC */
    .assoc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
    .assoc-left { font-size: 0.85rem; font-weight: 400; padding: 8px 10px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 3px; margin-bottom: 6px; }
    .drop-zone {
      min-height: 38px;
      border: 1.5px dashed var(--border);
      border-radius: 3px;
      padding: 4px 8px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      font-size: 0.78rem;
      color: var(--muted);
      transition: border-color 0.15s, background 0.15s;
    }
    .drop-zone.over { border-color: var(--gold); background: #fdf8ee; }
    .drag-item {
      display: inline-block;
      padding: 5px 10px;
      margin: 3px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 3px;
      cursor: grab;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      user-select: none;
      transition: border-color 0.15s;
    }
    .drag-item:hover { border-color: var(--gold); }
    .drag-item.dragging { opacity: 0.35; }
    .items-pool {
      padding: 8px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 3px;
      min-height: 60px;
    }
    .check-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      border: 1.5px solid var(--border);
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .check-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* CHRONO */
    .chrono-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0.65rem 0.85rem;
      margin-bottom: 6px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 3px;
      cursor: grab;
      font-size: 0.85rem;
      transition: border-color 0.15s;
    }
    .chrono-item:hover { border-color: var(--gold); }
    .handle { color: var(--muted); font-size: 1rem; }

    /* RESULT */
    .result-screen {
      display: none;
      text-align: center;
      padding: 3rem 1rem;
    }
    .result-emoji { font-size: 3.5rem; margin-bottom: 0.75rem; }
    .result-score {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 0.25rem;
    }
    .result-msg { font-size: 1rem; color: var(--muted); margin-bottom: 2rem; font-style: italic; }
    .replay-btn {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.7rem 1.5rem;
      border: 1.5px solid var(--gold);
      border-radius: 2px;
      background: transparent;
      color: var(--gold);
      cursor: pointer;
    }
    .replay-btn:hover { background: var(--gold); color: #fff; }

    @media (max-width: 480px) {
      .assoc-grid { grid-template-columns: 1fr; }
      .question-text { font-size: 1rem; }
    }
  </style>
</head>
<body>

<nav>
  <a href="index.html">← Retour aux fiches</a>
  <span class="nav-title">Jeu de révision</span>
</nav>

<div class="wrapper">

  <div id="score-bar" class="score-bar">
    <span>Q <span id="q-num">1</span>/10</span>
    <span>Score : <strong id="score" style="color:var(--ink);">0</strong></span>
    <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
    <button class="reset-btn" onclick="resetGame()">Rejouer</button>
  </div>

  <div id="game-area"></div>
  <div id="feedback" class="feedback"></div>
  <button id="next-btn" class="next-btn" onclick="nextQuestion()">Question suivante →</button>

  <div id="result-screen" class="result-screen">
    <div class="result-emoji" id="r-emoji"></div>
    <div class="result-score" id="r-score"></div>
    <div class="result-msg" id="r-msg"></div>
    <button class="replay-btn" onclick="resetGame()">Rejouer</button>
  </div>

</div>

<script>
const ALL_Q = [
  {type:'qcm',q:'Quel surnom portait Georges Clemenceau ?',opts:['Le Tigre','Le Lion','Le Père la Victoire','L\'Aigle'],correct:0,expl:'Clemenceau était surnommé « le Tigre » pour sa combativité, et « le Père la Victoire » après l\'armistice de 1918.'},
  {type:'qcm',q:'Quand Jean Jaurès a-t-il été assassiné ?',opts:['2 août 1914','31 juillet 1914','4 août 1914','11 novembre 1918'],correct:1,expl:'Jaurès a été assassiné le 31 juillet 1914, la veille de la mobilisation générale, par le nationaliste Raoul Villain.'},
  {type:'qcm',q:'Quel événement Lénine dirige-t-il en octobre 1917 ?',opts:['La révolution de Février','L\'armistice avec l\'Allemagne','La révolution d\'Octobre','La fondation de l\'URSS'],correct:2,expl:'Lénine dirige le coup d\'État bolchévique d\'Octobre 1917, qui fonde le premier État communiste.'},
  {type:'qcm',q:'Quel acte fonde la construction européenne en 1950 ?',opts:['Le traité de Maastricht','La déclaration Schuman','Le plan Marshall','La conférence de Yalta'],correct:1,expl:'Le 9 mai 1950, Schuman propose la mise en commun du charbon et de l\'acier franco-allemands. Le 9 mai est la Journée de l\'Europe.'},
  {type:'qcm',q:'Jean Moulin préside en 1943 la première réunion de…',opts:['La France libre','Le Conseil national de la Résistance','Le gouvernement provisoire','Le réseau Libération-Sud'],correct:1,expl:'En mai 1943, Moulin préside la première réunion du CNR, unifiant tous les mouvements de résistance sous l\'autorité de de Gaulle.'},
  {type:'qcm',q:'Quelle loi Simone Veil fait-elle adopter ?',opts:['Abolition de la peine de mort','Légalisation de l\'IVG','Loi sur la parité','Loi de décentralisation'],correct:1,expl:'Simone Veil, ministre de la Santé, fait adopter la loi légalisant l\'IVG malgré une violente opposition, en novembre 1974.'},
  {type:'qcm',q:'La doctrine Truman engage les États-Unis à…',opts:['Reconstruire l\'Europe','Soutenir tout peuple résistant au communisme','Créer l\'OTAN','Lancer la bombe atomique'],correct:1,expl:'La doctrine Truman (1947) engage les États-Unis à soutenir tous les peuples résistant à l\'expansion communiste soviétique.'},
  {type:'qcm',q:'Que signifie « glasnost » ?',opts:['Restructuration économique','Transparence et liberté d\'expression','Non-alignement','Déstalinisation'],correct:1,expl:'La glasnost (transparence) est l\'une des deux réformes de Gorbatchev avec la perestroïka (restructuration). Elles accélèrent la fin de l\'URSS.'},
  {type:'qcm',q:'Quel événement symbolise la fin de la guerre froide en 1989 ?',opts:['Dissolution de l\'URSS','Crise des missiles de Cuba','Chute du mur de Berlin','Traité de Maastricht'],correct:2,expl:'La chute du mur de Berlin le 9 novembre 1989 est le symbole de la fin de la guerre froide.'},
  {type:'qcm',q:'Qui nationalise le canal de Suez en 1956 ?',opts:['Nehru','Churchill','Nasser','Khrouchtchev'],correct:2,expl:'Nasser nationalise le canal de Suez en juillet 1956, provoquant une crise internationale et s\'imposant comme leader du nationalisme arabe.'},
  {type:'qcm',q:'Quel traité fonde l\'Union européenne en 1992 ?',opts:['Traité de Rome','Traité de Versailles','Traité de Maastricht','Traité de Lisbonne'],correct:2,expl:'Le traité de Maastricht (1992), signé notamment sous Mitterrand, crée l\'Union européenne et pose les bases de la monnaie unique.'},
  {type:'qcm',q:'Où de Gaulle lance-t-il son appel à la résistance le 18 juin 1940 ?',opts:['À Paris','À Alger','À Londres depuis la BBC','À Bordeaux'],correct:2,expl:'De Gaulle lance son appel depuis Londres, depuis les studios de la BBC, refusant l\'armistice signé par Pétain.'},
  {type:'assoc',q:'Associez chaque personnage à son action historique',pairs:[
    {left:'De Gaulle',right:'Appel du 18 juin 1940'},
    {left:'Pétain',right:'Armistice et régime de Vichy'},
    {left:'Jean Moulin',right:'Unification de la Résistance (CNR)'},
    {left:'Lucie Aubrac',right:'Évasion armée de son mari résistant'},
  ]},
  {type:'assoc',q:'Associez chaque dirigeant à son pays',pairs:[
    {left:'Nasser',right:'Égypte'},
    {left:'Nehru',right:'Inde'},
    {left:'Churchill',right:'Royaume-Uni'},
    {left:'Roosevelt',right:'États-Unis'},
  ]},
  {type:'assoc',q:'Associez chaque réforme à son auteur',pairs:[
    {left:'Glasnost / Perestroïka',right:'Gorbatchev'},
    {left:'New Deal',right:'Roosevelt'},
    {left:'Loi sur l\'IVG',right:'Simone Veil'},
    {left:'Déclaration Schuman',right:'Robert Schuman'},
  ]},
  {type:'chrono',q:'Remettez dans l\'ordre chronologique (du plus ancien au plus récent)',items:[
    {label:'Assassinat de Jaurès',year:1914},
    {label:'Révolution d\'Octobre (Lénine)',year:1917},
    {label:'Hitler chancelier',year:1933},
    {label:'Appel du 18 juin (de Gaulle)',year:1940},
    {label:'Déclaration Schuman',year:1950},
  ]},
  {type:'chrono',q:'Remettez dans l\'ordre chronologique (du plus ancien au plus récent)',items:[
    {label:'Nationalisation du canal de Suez',year:1956},
    {label:'Crise des missiles de Cuba',year:1962},
    {label:'Loi Veil sur l\'IVG',year:1975},
    {label:'Chute du mur de Berlin',year:1989},
    {label:'Traité de Maastricht',year:1992},
  ]},
];

let questions=[], current=0, score=0, answered=false, dragSrc=null, chDragging=null;

function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}

function pickQuestions(){
  const qcm=shuffle(ALL_Q.filter(q=>q.type==='qcm')).slice(0,6);
  const assoc=shuffle(ALL_Q.filter(q=>q.type==='assoc')).slice(0,2);
  const chrono=shuffle(ALL_Q.filter(q=>q.type==='chrono')).slice(0,2);
  return shuffle([...qcm,...assoc,...chrono]);
}

function resetGame(){
  questions=pickQuestions(); current=0; score=0; answered=false;
  document.getElementById('score').textContent=0;
  document.getElementById('result-screen').style.display='none';
  document.getElementById('game-area').style.display='block';
  document.getElementById('score-bar').style.display='flex';
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  renderQuestion();
}

function renderQuestion(){
  answered=false;
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('q-num').textContent=current+1;
  document.getElementById('progress').style.width=((current/questions.length)*100)+'%';
  const q=questions[current];
  const area=document.getElementById('game-area');
  if(q.type==='qcm') renderQCM(q,area);
  else if(q.type==='assoc') renderAssoc(q,area);
  else renderChrono(q,area);
}

function renderQCM(q,area){
  const opts=shuffle(q.opts.map((o,i)=>({text:o,orig:i})));
  area.innerHTML=`<p class="type-label">Question à choix multiple</p><p class="question-text">${q.q}</p>`
    +opts.map(o=>`<button class="opt-btn" onclick="checkQCM(this,${o.orig===q.correct},'${q.expl.replace(/'/g,"&#39;").replace(/"/g,"&quot;")}')">${o.text}</button>`).join('');
}

function checkQCM(btn,correct,expl){
  if(answered)return; answered=true;
  document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true);
  if(correct){btn.classList.add('correct');score++;document.getElementById('score').textContent=score;showFeedback(true,'✓ Bonne réponse ! '+expl);}
  else{btn.classList.add('wrong');showFeedback(false,'✗ Pas tout à fait. '+expl);}
  document.getElementById('next-btn').style.display='inline-block';
}

function renderAssoc(q,area){
  const rights=shuffle(q.pairs.map(p=>p.right));
  area.innerHTML=`<p class="type-label">Association — glissez-déposez</p><p class="question-text">${q.q}</p>
  <div class="assoc-grid">
    <div>${q.pairs.map(p=>`<div class="assoc-left">${p.left}</div><div class="drop-zone" data-answer="${p.right}" ondragover="ev.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="dropItem(event,this)">Déposer ici</div>`).join('')}</div>
    <div class="items-pool" id="pool" ondragover="ev.preventDefault()" ondrop="dropToPool(event)">${rights.map(r=>`<div class="drag-item" draggable="true" data-val="${r}" ondragstart="dStart(event)" ondragend="dEnd(event)">${r}</div>`).join('')}</div>
  </div>
  <button class="check-btn" onclick="checkAssoc()">Vérifier →</button>`;
}

function dStart(ev){dragSrc=ev.target;ev.target.classList.add('dragging');ev.dataTransfer.setData('text',ev.target.dataset.val);}
function dEnd(ev){ev.target.classList.remove('dragging');document.querySelectorAll('.drop-zone').forEach(z=>z.classList.remove('over'));}
function dropItem(ev,zone){
  ev.preventDefault();zone.classList.remove('over');
  const val=ev.dataTransfer.getData('text');
  const item=document.querySelector(`.drag-item[data-val="${val}"]`);
  if(!item)return;
  const existing=zone.querySelector('.drag-item');
  if(existing)document.getElementById('pool').appendChild(existing);
  if(zone.textContent.trim()==='Déposer ici')zone.textContent='';
  zone.appendChild(item);
}
function dropToPool(ev){
  ev.preventDefault();
  const val=ev.dataTransfer.getData('text');
  const item=document.querySelector(`.drag-item[data-val="${val}"]`);
  if(item)document.getElementById('pool').appendChild(item);
}

function checkAssoc(){
  if(answered)return; answered=true;
  let ok=0;
  document.querySelectorAll('.drop-zone').forEach(z=>{
    const item=z.querySelector('.drag-item');
    if(item&&item.dataset.val===z.dataset.answer){ok++;item.style.background='var(--green-bg)';item.style.borderColor='var(--green-border)';item.style.color='var(--green-text)';}
    else if(item){item.style.background='var(--red-bg)';item.style.borderColor='var(--red-border)';item.style.color='var(--red-text)';}
  });
  const total=q_pairs_count();
  if(ok===total){score++;document.getElementById('score').textContent=score;showFeedback(true,`✓ Parfait ! Toutes les associations sont correctes.`);}
  else showFeedback(false,`✗ ${ok}/${total} bonnes associations. Les erreurs sont en rouge.`);
  document.getElementById('next-btn').style.display='inline-block';
}
function q_pairs_count(){return document.querySelectorAll('.drop-zone').length;}

function renderChrono(q,area){
  const shuffled=shuffle(q.items);
  area.innerHTML=`<p class="type-label">Chronologie — glissez pour réordonner</p><p class="question-text">${q.q}</p>
  <div id="chrono-list">${shuffled.map(item=>`<div class="chrono-item" draggable="true" data-year="${item.year}" ondragstart="cStart(event)" ondragover="cOver(event)" ondrop="cDrop(event)" ondragend="cEnd()"><span class="handle">⠿</span><span>${item.label}</span></div>`).join('')}</div>
  <button class="check-btn" onclick="checkChrono()" style="margin-top:0.75rem;">Vérifier l'ordre →</button>`;
}

function cStart(ev){chDragging=ev.currentTarget;}
function cEnd(){chDragging=null;}
function cOver(ev){ev.preventDefault();if(chDragging&&ev.currentTarget!==chDragging){const l=document.getElementById('chrono-list');const items=[...l.children];const fi=items.indexOf(chDragging);const ti=items.indexOf(ev.currentTarget);if(fi<ti)ev.currentTarget.after(chDragging);else ev.currentTarget.before(chDragging);}}
function cDrop(ev){ev.preventDefault();}

function checkChrono(){
  if(answered)return; answered=true;
  const items=[...document.querySelectorAll('#chrono-list .chrono-item')];
  const years=items.map(el=>parseInt(el.dataset.year));
  const sorted=[...years].sort((a,b)=>a-b);
  const correct=years.every((y,i)=>y===sorted[i]);
  items.forEach((el,i)=>{el.style.background=years[i]===sorted[i]?'var(--green-bg)':'var(--red-bg)';el.style.borderColor=years[i]===sorted[i]?'var(--green-border)':'var(--red-border)';});
  if(correct){score++;document.getElementById('score').textContent=score;showFeedback(true,'✓ Ordre parfait ! Vous maîtrisez la chronologie.');}
  else showFeedback(false,'✗ L\'ordre n\'est pas tout à fait correct. Le vert = bien placé, le rouge = à revoir.');
  document.getElementById('next-btn').style.display='inline-block';
}

function showFeedback(ok,msg){
  const fb=document.getElementById('feedback');
  fb.className='feedback '+(ok?'ok':'ko');
  fb.style.display='block';
  fb.textContent=msg;
}

function nextQuestion(){
  current++;
  if(current>=questions.length)showResult();
  else renderQuestion();
}

function showResult(){
  document.getElementById('game-area').style.display='none';
  document.getElementById('score-bar').style.display='none';
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  const pct=score/questions.length;
  document.getElementById('result-screen').style.display='block';
  document.getElementById('r-emoji').textContent=pct>=0.8?'🏆':pct>=0.5?'👍':'📚';
  document.getElementById('r-score').textContent=score+' / '+questions.length;
  document.getElementById('r-msg').textContent=pct>=0.8?'Excellent ! Vous êtes prêt(e) pour le brevet.':pct>=0.5?'Bien ! Encore quelques révisions et ce sera parfait.':'Continuez à réviser avec les fiches — vous progressez !';
}

resetGame();
</script>
</body>
</html>
